# Fork build: Linux x64 headless binary only.
# Upstream multi-platform release workflow has been removed.

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel in-progress runs for the same ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every CI build is a clean build of a new commit, so incremental compilation
  # can never be reused; it would only write gigabytes of small files into
  # target/<triple>/release/incremental that the cache then drags along.
  CARGO_INCREMENTAL: 0
  # The build is one ~20-40 minute job; a single dropped crates.io or rustup
  # download would otherwise fail it. Retry instead.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build-linux-headless:
    name: Rust · Linux x64 headless
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu
          cache-on-failure: true

      - id: version
        name: Resolve version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            VERSION_NUMBER="${VERSION#v}"
            CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            [ "$VERSION_NUMBER" = "$CARGO_VERSION" ] || { echo "Tag $VERSION does not match Cargo.toml $CARGO_VERSION" >&2; exit 1; }
          else
            VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Build Rust binary
        shell: bash
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin screenerbot

      - name: Report required glibc version
        shell: bash
        run: |
          GLIBC="$(objdump -T target/x86_64-unknown-linux-gnu/release/screenerbot | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)"
          echo "Highest required glibc: ${GLIBC}"

      - name: Package headless binary (Linux)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p headless-pkg
          cp target/x86_64-unknown-linux-gnu/release/screenerbot headless-pkg/screenerbot
          chmod +x headless-pkg/screenerbot
          tar -czf "ScreenerBot-${VERSION}-Linux-x64-headless.tar.gz" -C headless-pkg screenerbot

      - name: Upload headless tarball (Linux)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-Linux-x64
          path: ScreenerBot-${{ steps.version.outputs.version }}-Linux-x64-headless.tar.gz
          if-no-files-found: error
          retention-days: 14
